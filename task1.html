<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 1 - Task 1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
      color: #333;
    }

    /* Navigation Menu */
    nav {
      background: #333;
      padding: 10px 20px;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
    }
    nav ul li {
      margin-right: 20px;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }
    nav ul li a:hover {
      color: #ff9800;
    }

    /* Main content */
    .container {
      max-width: 800px;
      margin: 30px auto;
      text-align: center;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #444;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
    }
    img {
      width: 100%;
      max-width: 400px;
      margin: 20px 0;
      border-radius: 8px;
    }

    /* Form */
    form {
      margin-top: 20px;
    }
    input[type="text"] {
      padding: 10px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    input[type="submit"] {
      padding: 10px 20px;
      margin-left: 10px;
      border: none;
      background: #333;
      color: white;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }
    input[type="submit"]:hover {
      background: #ff9800;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- Content -->
  <div class="container">
    <h1>Welcome to My Webpage</h1>
    <p>This is a simple webpage created using HTML and CSS. It includes a heading, a paragraph, an image, a form, and a navigation menu.</p>
    <img src="images/about_2.jpg" alt="Sample Image">

    <!-- Form -->
    <form action="#">
      <input type="text" placeholder="Enter your name">
      <input type="submit" value="Submit">
    </form>
  </div>

</body>
</html>
