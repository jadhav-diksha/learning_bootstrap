 <link href="css/contact.css" rel="stylesheet">
</head>
<body>

   <!-- Logo -->
   <div class="container-fluid py- d-flex flex-wrap justify-content-between align-items-center">

    <!-- Logo -->
    <div class="logo text-center">
      <img src="images/rhytmart.jpeg" alt="Logo" class="logo-img" height="90px" >
      
    </div>

    
    <!-- Menu Bar -->
  <nav class="navbar navbar-expand-lg navbar-red border-top ">
  <div class="container-fluid justify-content-center">
    <ul class="navbar-nav text-dark data-bs-theme=dark">
      <li class="nav-item mx-3 "><a class="nav-link" href="index.html">HOME</a></li>
      <li class="nav-item mx-3"><a class="nav-link" href="painting.html">PAINTINGS</a></li>
      <li class="nav-item mx-3"><a class="nav-link" href="artist.html">ARTIST</a></li>
     
      <li class="nav-item mx-3"><a class="nav-link" href="#">BLOG</a></li>
      <li class="nav-item mx-3"><a class="nav-link" href="about.html">ABOUT US</a></li>
      <li class="nav-item mx-3"><a class="nav-link" href="contact.html">CONTACT US</a></li>
    </ul>
  </div>
</nav>
</div>

<div class="bg-contact">
  <div class="container contact-container py-5">
    <h2 class="text-center text-white mb-5">Contact Us</h2>
    <div class="row g-4">
      
      <!-- Contact Info -->
      <div class="col-md-6">
        <div class="contact-info">
          <h2>Get in Touch</h2>
          <p><i class="bi bi-geo-alt-fill text-danger"></i> 123 Art Gallery, Pune, India</p>
          <p><i class="bi bi-telephone-fill text-success"></i> +91 9876543210</p>
          <p><i class="bi bi-envelope-fill text-primary"></i> artgallery@gmail.com</p>
          <p><i class="bi bi-clock-fill text-warning"></i> Mon - Sat: 9:00 AM - 6:00 PM</p>

          <form class="mt-4">
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="Your Name" required>
            </div>
            <div class="mb-3">
              <input type="email" class="form-control" placeholder="Your Email" required>
            </div>
            <div class="mb-3">
              <textarea class="form-control" rows="4" placeholder="Your Message"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Send Message</button>
          </form>
        </div>
      </div>

      <!-- Map -->
      <div class="col-md-6 map">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3783.308416869267!2d73.856743!3d18.520430!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2c075d87e4e65%3A0xbee4f0f7a0c90b!2sPune!5e0!3m2!1sen!2sin!4v1692358776535" 
          allowfullscreen="" loading="lazy"></iframe>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
