<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto Scrolling Film Strip</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0d1117; color: #fff; }

    h1 {
      text-align: center;
      margin: 30px 0;
      font-weight: bold;
    }

    /* Filmstrip container */
    .film-strip-container {
      position: relative;
      overflow: hidden;
      background: #000;  /* only black */
      padding: 20px 0;
    }

    /* Filmstrip row */
    .film-strip {
      display: flex;
      align-items: center;
      animation: scroll-strip 40s linear infinite;
    }

    /* Posters inside */
    .film-strip img {
      height: 200px;
      margin: 0 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6);
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }

    .film-strip img:hover {
      transform: scale(1.1);
    }

    /* Infinite scrolling */
    @keyframes scroll-strip {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .film-strip-inner {
      display: flex;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <h1>Movie Film Strip</h1>
    <div class="film-strip-container">
      <div class="film-strip">
        <div class="film-strip-inner">
          <!-- Posters (Set 1) -->
          <img src="https://m.media-amazon.com/images/I/71niXI3lxlL._AC_SL1024_.jpg" alt="Inception">
          <img src="https://m.media-amazon.com/images/I/81p+xe8cbnL._AC_SL1500_.jpg" alt="Avengers">
          <img src="https://m.media-amazon.com/images/I/71c05lTE03L._AC_SL1024_.jpg" alt="Dark Knight">
          <img src="https://m.media-amazon.com/images/I/81b5eYfA1mL._AC_SL1500_.jpg" alt="Interstellar">
          <img src="https://m.media-amazon.com/images/I/91z3E5pZVQL._AC_SL1500_.jpg" alt="Spider-Man">
          <img src="https://m.media-amazon.com/images/I/91jYgXUzA-L._AC_SL1500_.jpg" alt="Frozen 2">

          <!-- Posters (Duplicate for seamless loop) -->
          <img src="https://m.media-amazon.com/images/I/71niXI3lxlL._AC_SL1024_.jpg" alt="Inception">
          <img src="https://m.media-amazon.com/images/I/81p+xe8cbnL._AC_SL1500_.jpg" alt="Avengers">
          <img src="https://m.media-amazon.com/images/I/71c05lTE03L._AC_SL1024_.jpg" alt="Dark Knight">
          <img src="https://m.media-amazon.com/images/I/81b5eYfA1mL._AC_SL1500_.jpg" alt="Interstellar">
          <img src="https://m.media-amazon.com/images/I/91z3E5pZVQL._AC_SL1500_.jpg" alt="Spider-Man">
          <img src="https://m.media-amazon.com/images/I/91jYgXUzA-L._AC_SL1500_.jpg" alt="Frozen 2">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
